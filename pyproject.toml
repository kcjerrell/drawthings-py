[project]
name = "drawthings-py"
version = "0.1.0"
description = "Python SDK for automating Draw Things image generation over gRPC."
authors = [{ name = "Kelly Jerrell", email = "kcjerrell@gmail.com" }]
readme = "readme.md"
license = "GPL-3.0-only"
license-files = ["license.md"]
requires-python = ">=3.11,<4.0"
keywords = [
    "draw-things",
    "grpc",
    "image-generation",
    "stable-diffusion",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "grpclib (>=0.4.9,<0.5.0)",
    "betterproto (>=2.0.0b6,<3.0.0)",
    "flatbuffers (>=25.12.19,<26.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "fpzip (>=1.2.5,<2.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
]

[project.urls]
Homepage = "https://github.com/kcjerrell/drawthings-py"
Repository = "https://github.com/kcjerrell/drawthings-py"
Issues = "https://github.com/kcjerrell/drawthings-py/issues"

[dependency-groups]
dev = [
    "betterproto[compiler] (>=2.0.0b6,<3.0.0)",
    "grpcio-tools (>=1.80.0,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pyright (>=1.1.409,<2.0.0)",
    "types-tqdm (>=4.67.3.20260518,<5.0.0.0)",
    "ruff (>=0.15.15,<0.16.0)",
    "coverage (>=7.14.1,<8.0.0)",
    "basedpyright (>=1.39.6,<2.0.0)",
    "strictyaml (>=1.7.3,<2.0.0)",
    "types-strictyaml (>=1.7.3.0,<2.0.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
exclude = [
    "src/drawthings_py/generated/*", 
    "src/drawthings_py/configs/gen_config_generated.py",
    "scripts/gen"
]
packages = ["drawthings_py", "examples"]

[[tool.mypy.overrides]]
module = ["flatbuffers.*", "fpzip.*"]
ignore_missing_imports = true

[tool.basedpyright]
include = ["src"]
exclude = [
    "src/drawthings_py/generated",
    "src/drawthings_py/_metadata.py",
    "src/drawthings_py/configs/gen_config_generated.py",
    "scripts/gen"
]
ignore = ["src/drawthings_py/generated"]
typeCheckingMode = "recommended"
reportImplicitStringConcatenation = "none"

[tool.ruff]
exclude = ["src/drawthings_py/generated", "scripts"]
