[project]
name = "drawthings-py"
version = "0.1.0"
description = "python wrapper for the drawthings grpc service and cli"
authors = [{ name = "Kelly Jerrell", email = "kcjerrell@gmail.com" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "grpclib (>=0.4.9,<0.5.0)",
    "betterproto (>=2.0.0b6,<3.0.0)",
    "flatbuffers (>=25.12.19,<26.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "fpzip (>=1.2.5,<2.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
]

[dependency-groups]
dev = [
    "betterproto[compiler] (>=2.0.0b6,<3.0.0)",
    "grpcio-tools (>=1.80.0,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pyright (>=1.1.409,<2.0.0)",
    "types-tqdm (>=4.67.3.20260518,<5.0.0.0)",
    "ruff (>=0.15.15,<0.16.0)",
    "coverage (>=7.14.1,<8.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
mypy_path = ["src"]
exclude = ["src/drawthings_py/generated"]

[[tool.mypy.overrides]]
module = ["flatbuffers.*", "fpzip.*"]
ignore_missing_imports = true

[tool.pyright]
exclude = ["src/drawthings_py/generated"]