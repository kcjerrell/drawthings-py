[project]
name = "drawthings-py"
version = "0.1.0"
description = "python wrapper for the drawthings grpc service and cli"
authors = [{ name = "Kelly Jerrell", email = "kcjerrell@gmail.com" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "grpclib (>=0.4.9,<0.5.0)",
    "betterproto[compiler] (>=2.0.0b6,<3.0.0)",
    "flatbuffers (>=25.12.19,<26.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "fpzip (>=1.2.5,<2.0.0)",
]

[dependency-groups]
dev = ["grpcio-tools (>=1.80.0,<2.0.0)", "black (>=26.5.1,<27.0.0)", "pytest (>=9.0.3,<10.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
